name: 'helm'

env:
  FOO: "BAR"

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    name: 'Helm dashboards with https url'
    runs-on: ubuntu-latest
    environment: production

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: https dashboards
      run: |
        export TOKEN=${{ secrets.GITHUB_TOKEN }}
        env
        echo $TOKEN
        helm repo add grafana https://grafana.github.io/helm-charts
        helm pull grafana/grafana --version 10.1.4 --untar
        cd grafana
        helm template my-grafana --dry-run --debug ./ -f ../dashboards.yaml
        # our case:
        # helm upgrade my-grafana grafana/grafana --version 10.1.4 -f dashboards.yaml

    - name: path dashboards
      run: |
        rm -rf grafana
        helm repo add grafana https://grafana.github.io/helm-charts
        helm pull grafana/grafana --version 10.1.4 --untar
        cp dashboards/* grafana/dashboards
        cd grafana
        helm template my-grafana --dry-run --debug ./ -f ../dashboards1.yam

  build:
     runs-on: ubuntu-latest
       
     steps:
       - name: Checkout
         uses: actions/checkout@v3
         
       - name: Setup JFrog CLI
         uses: jfrog/setup-jfrog-cli@v4
         env:  
           JF_URL: ${{ vars.JF_URL }}
           JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
           
       - name: Set CLI Config
         run: jf pip-config --global=true --repo-resolve=tomas-pypi
           
       - name: Install Deps
         run: jf pip install .
           
       - name: Package the project
         run: python setup.py sdist bdist_wheel
         
       - name: Publish
         run: jf rt upload dist/ tomas-pypi/
         
       - name: Publish Build info With JFrog CLI
         run: |
          # Collect environment variables for the build
          jf rt build-collect-env
          # Collect VCS details from git and add them to the build
          jf rt build-add-git
          # Publish build info
          jf rt build-publish
